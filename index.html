    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
